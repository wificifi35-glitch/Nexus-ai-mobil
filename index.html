<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Nexus-AI</title>


<style>

/* =========================================
   TEMEL
========================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#080b12;
    color:#ffffff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    height:100vh;
    overflow:hidden;
}

.app{
    height:100vh;
    display:flex;
    flex-direction:column;
}


/* =========================================
   HEADER
========================================= */

.header{
    height:70px;
    flex-shrink:0;

    display:flex;
    align-items:center;

    padding:0 16px;

    background:#0d1119;

    border-bottom:
        1px solid #202633;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.logoIcon{
    width:42px;
    height:42px;

    border-radius:14px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:21px;
    font-weight:900;

    background:
        linear-gradient(
            135deg,
            #695cff,
            #00c8ff
        );
}

.logoText{
    font-size:20px;
    font-weight:700;
}

.status{
    margin-left:auto;

    display:flex;
    align-items:center;

    gap:8px;

    color:#8993a5;

    font-size:13px;
}

.dot{
    width:8px;
    height:8px;

    border-radius:50%;

    background:#f0a500;

    box-shadow:
        0 0 9px #f0a500;
}


/* =========================================
   CHAT
========================================= */

.chat{
    flex:1;

    overflow-y:auto;

    padding:
        20px
        14px
        120px;
}

.welcome{
    text-align:center;

    margin-top:18vh;
}

.welcomeIcon{
    width:76px;
    height:76px;

    margin:auto;

    border-radius:24px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:34px;
    font-weight:900;

    background:
        linear-gradient(
            135deg,
            #695cff,
            #00c8ff
        );

    box-shadow:
        0 0 35px
        rgba(80,100,255,.20);
}

.welcome h1{
    margin-top:18px;

    font-size:29px;
}

.welcome p{
    margin:
        10px auto 0;

    max-width:330px;

    color:#858fa2;

    font-size:14px;

    line-height:1.5;
}


/* =========================================
   MESAJLAR
========================================= */

.message{
    display:flex;

    margin-bottom:16px;
}

.message.user{
    justify-content:flex-end;
}

.bubble{
    max-width:86%;

    padding:
        12px
        15px;

    border-radius:17px;

    font-size:15px;

    line-height:1.5;

    white-space:pre-wrap;

    word-break:break-word;
}

.user .bubble{
    background:
        linear-gradient(
            135deg,
            #6256ee,
            #4840c4
        );

    border-bottom-right-radius:5px;
}

.ai .bubble{
    background:#151a24;

    border:
        1px solid #252c3a;

    border-bottom-left-radius:5px;
}


/* =========================================
   INPUT
========================================= */

.inputArea{
    position:fixed;

    left:0;
    bottom:0;

    width:100%;

    padding:
        10px
        14px
        14px;

    background:
        linear-gradient(
            transparent,
            #080b12 30%
        );
}

.inputBox{
    display:flex;

    align-items:flex-end;

    gap:8px;

    padding:7px;

    background:#10151e;

    border:
        1px solid #29303e;

    border-radius:20px;
}

textarea{
    flex:1;

    min-height:42px;
    max-height:120px;

    resize:none;

    border:none;
    outline:none;

    background:transparent;

    color:white;

    padding:
        10px
        7px;

    font-size:15px;
}

textarea::placeholder{
    color:#687386;
}

.send{
    width:44px;
    height:44px;

    flex-shrink:0;

    border:none;

    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            #695cff,
            #00b9ed
        );

    color:white;

    font-size:19px;

    cursor:pointer;
}

.send:disabled{
    opacity:.4;
}


/* =========================================
   MOBİL KONSOL BUTONU
========================================= */

#consoleButton{
    position:fixed;

    right:14px;
    bottom:82px;

    z-index:9999;

    border:none;

    border-radius:14px;

    padding:
        10px
        13px;

    background:#171d28;

    color:#cbd3e1;

    font-size:12px;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,.35);
}


/* =========================================
   KONSOL PANELİ
========================================= */

#consolePanel{
    position:fixed;

    left:10px;
    right:10px;

    bottom:10px;

    height:55vh;

    z-index:10000;

    background:#0b0f16;

    border:
        1px solid #303847;

    border-radius:18px;

    display:none;

    flex-direction:column;

    overflow:hidden;

    box-shadow:
        0 15px 50px
        rgba(0,0,0,.65);
}

#consolePanel.open{
    display:flex;
}

.consoleHeader{
    min-height:52px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
        0
        12px;

    background:#111620;

    border-bottom:
        1px solid #252c38;
}

.consoleHeader strong{
    font-size:14px;
}

.consoleActions{
    display:flex;

    gap:6px;
}

.consoleActions button{
    border:none;

    border-radius:9px;

    padding:
        7px
        9px;

    background:#202735;

    color:#cbd3e1;

    font-size:11px;
}

.nexusConsole{
    flex:1;

    overflow-y:auto;

    padding:10px;

    font-family:
        monospace;

    font-size:11px;

    line-height:1.5;
}

.consoleLine{
    padding:5px 0;

    border-bottom:
        1px solid
        rgba(255,255,255,.04);

    word-break:break-word;
}

.consoleTime{
    color:#657086;

    margin-right:7px;
}

.consoleLine.error{
    color:#ff7777;
}

.consoleLine.success{
    color:#55d995;
}

.consoleLine.info{
    color:#c3cada;
}

</style>

</head>


<body>


<div class="app">


<!-- HEADER -->

<header class="header">

    <div class="logo">

        <div class="logoIcon">
            N
        </div>

        <div class="logoText">
            Nexus-AI
        </div>

    </div>


    <div class="status">

        <div
            class="dot"
            id="statusDot">
        </div>

        <span id="statusText">
            Başlatılıyor...
        </span>

    </div>

</header>


<!-- CHAT -->

<main
    class="chat"
    id="chat"
>

    <div
        class="welcome"
        id="welcome"
    >

        <div class="welcomeIcon">
            N
        </div>

        <h1>
            Nexus-AI
        </h1>

        <p id="welcomeText">
            Nexus-AI başlatılıyor...
        </p>

    </div>

</main>


<!-- INPUT -->

<div class="inputArea">

    <div class="inputBox">

        <textarea
            id="messageInput"
            placeholder="Nexus'a bir şey sor..."
            rows="1"
            disabled>
        </textarea>


        <button
            class="send"
            id="sendButton"
            disabled>
            ➤
        </button>

    </div>

</div>


</div>


<script type="module">


/* =========================================
   TRANSFORMERS.JS
========================================= */

import {
    pipeline
} from
"https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.2.0";


/* =========================================
   MODEL
========================================= */

const MODEL =
"onnx-community/Qwen2.5-0.5B-Instruct";


/* =========================================
   ELEMENTLER
========================================= */

const chat =
document.getElementById("chat");

const input =
document.getElementById(
    "messageInput"
);

const sendButton =
document.getElementById(
    "sendButton"
);

const welcome =
document.getElementById(
    "welcome"
);

const welcomeText =
document.getElementById(
    "welcomeText"
);

const statusText =
document.getElementById(
    "statusText"
);

const statusDot =
document.getElementById(
    "statusDot"
);


/* =========================================
   AI
========================================= */

let generator =
null;

let aiReady =
false;


/* =========================================
   KONUŞMA HAFIZASI
========================================= */

const messages = [

    {
        role:"system",

        content:
        "Sen Nexus-AI'sın. Türkçe konuş. Yardımcı, doğal, anlaşılır ve doğru cevaplar ver."
    }

];


/* =========================================
   HATA METNİ
========================================= */

function stringifyError(error){

    if(!error){

        return "Bilinmeyen hata";

    }


    if(
        typeof error ===
        "string"
    ){

        return error;

    }


    if(error.message){

        return error.message;

    }


    try{

        const json =
            JSON.stringify(
                error
            );

        if(json !== "{}"){

            return json;

        }

    }catch{}


    return String(error);

}


/* =========================================
   HTML GÜVENLİĞİ
========================================= */

function escapeHTML(text){

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =========================================
   MOBİL KONSOL OLUŞTUR
========================================= */

function createConsole(){

    const panel =
        document.createElement(
            "div"
        );

    panel.id =
        "consolePanel";


    panel.innerHTML = `

        <div class="consoleHeader">

            <strong>
                Nexus Console
            </strong>

            <div class="consoleActions">

                <button
                    id="clearConsole">
                    Temizle
                </button>

                <button
                    id="closeConsole">
                    Kapat
                </button>

            </div>

        </div>


        <div
            id="nexusConsole"
            class="nexusConsole">
        </div>

    `;


    document.body.appendChild(
        panel
    );


    const button =
        document.createElement(
            "button"
        );


    button.id =
        "consoleButton";


    button.textContent =
        "⚙ Konsol";


    document.body.appendChild(
        button
    );


    button.addEventListener(
        "click",
        () => {

            panel.classList.toggle(
                "open"
            );

        }
    );


    document
        .getElementById(
            "closeConsole"
        )
        .addEventListener(
            "click",
            () => {

                panel.classList.remove(
                    "open"
                );

            }
        );


    document
        .getElementById(
            "clearConsole"
        )
        .addEventListener(
            "click",
            () => {

                document
                    .getElementById(
                        "nexusConsole"
                    )
                    .innerHTML = "";

                debug(
                    "Konsol temizlendi."
                );

            }
        );

}


/* =========================================
   DEBUG
========================================= */

function debug(
    message,
    type="info"
){

    const time =
        new Date()
        .toLocaleTimeString();


    const consoleBox =
        document.getElementById(
            "nexusConsole"
        );


    if(consoleBox){

        const line =
            document.createElement(
                "div"
            );


        line.className =
            "consoleLine " +
            type;


        line.innerHTML = `

            <span
                class="consoleTime">
                ${time}
            </span>

            <span>
                ${escapeHTML(
                    message
                )}
            </span>

        `;


        consoleBox.appendChild(
            line
        );


        consoleBox.scrollTop =
            consoleBox.scrollHeight;

    }


    console.log(
        "[NEXUS]",
        message
    );

}


/* =========================================
   GLOBAL HATA YAKALAMA
========================================= */

window.addEventListener(
    "error",
    event => {

        debug(
            "JAVASCRIPT HATASI: " +
            event.message,
            "error"
        );

    }
);


window.addEventListener(
    "unhandledrejection",
    event => {

        debug(
            "PROMISE HATASI: " +
            stringifyError(
                event.reason
            ),
            "error"
        );

    }
);


/* =========================================
   KONSOLU BAŞLAT
========================================= */

createConsole();


/* =========================================
   DURUM
========================================= */

function setStatus(
    title,
    description,
    ready=false
){

    statusText.textContent =
        title;

    welcomeText.textContent =
        description;


    if(ready){

        statusDot.style.background =
            "#32d583";

        statusDot.style.boxShadow =
            "0 0 10px #32d583";

    }else{

        statusDot.style.background =
            "#f0a500";

        statusDot.style.boxShadow =
            "0 0 10px #f0a500";

    }

}


/* =========================================
   MESAJ EKLE
========================================= */

function addMessage(
    text,
    type
){

    welcome.style.display =
        "none";


    const message =
        document.createElement(
            "div"
        );


    message.className =
        "message " +
        type;


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "bubble";


    bubble.textContent =
        text;


    message.appendChild(
        bubble
    );


    chat.appendChild(
        message
    );


    chat.scrollTop =
        chat.scrollHeight;

}


/* =========================================
   NEXUS BAŞLAT
========================================= */

async function startNexus(){

    debug(
        "================================"
    );

    debug(
        "NEXUS-AI BAŞLATILIYOR"
    );

    debug(
        "================================"
    );


    try{


        /* ------------------------------
           AŞAMA 1
        ------------------------------ */

        setStatus(
            "Başlatılıyor...",
            "Nexus-AI başlatılıyor..."
        );


        debug(
            "WebGPU kontrol ediliyor..."
        );


        if(!navigator.gpu){

            throw new Error(
                "WebGPU desteklenmiyor."
            );

        }


        debug(
            "WebGPU bulundu.",
            "success"
        );


        /* ------------------------------
           AŞAMA 2
        ------------------------------ */

        debug(
            "Tarayıcı: " +
            navigator.userAgent
        );


        debug(
            "Model: " +
            MODEL
        );


        /* ------------------------------
           AŞAMA 3
        ------------------------------ */

        setStatus(
            "Model hazırlanıyor...",
            "AI modeli kontrol ediliyor..."
        );


        debug(
            "Transformers.js pipeline başlatılıyor..."
        );


        const startTime =
            performance.now();


        /* ------------------------------
           AŞAMA 4
        ------------------------------ */

        generator =
            await pipeline(

                "text-generation",

                MODEL,

                {

                    dtype:
                        "q4",

                    device:
                        "webgpu",


                    progress_callback:
                        progress => {


                            try{


                                if(!progress){

                                    debug(
                                        "Progress verisi boş."
                                    );

                                    return;

                                }


                                debug(
                                    "MODEL: " +
                                    JSON.stringify(
                                        progress
                                    )
                                );


                                if(
                                    progress.status ===
                                    "progress"
                                ){

                                    const percent =
                                        Math.round(
                                            Number(
                                                progress.progress ||
                                                0
                                            )
                                        );


                                    setStatus(

                                        "Model %" +
                                        percent,

                                        "AI modeli indiriliyor: %" +
                                        percent

                                    );

                                }


                                if(
                                    progress.status ===
                                    "done"
                                ){

                                    debug(
                                        "Bir model dosyası tamamlandı.",
                                        "success"
                                    );

                                }


                                if(
                                    progress.status ===
                                    "ready"
                                ){

                                    debug(
                                        "Model hazır sinyali alındı.",
                                        "success"
                                    );

                                }


                            }catch(error){

                                debug(

                                    "Progress hatası: " +
                                    stringifyError(
                                        error
                                    ),

                                    "error"

                                );

                            }

                        }

                }

            );


        /* ------------------------------
           AŞAMA 5
        ------------------------------ */

        const elapsed =
            Math.round(

                (
                    performance.now() -
                    startTime

                ) / 1000

            );


        debug(

            "pipeline() tamamlandı."

        );


        debug(

            "Toplam süre: " +
            elapsed +
            " saniye.",

            "success"

        );


        setStatus(

            "Model indirildi",

            "Model başarıyla yüklendi. Nexus-AI başlatılıyor..."

        );


        debug(

            "Model nesnesi başarıyla oluşturuldu.",

            "success"

        );


        /* ------------------------------
           AŞAMA 6
        ------------------------------ */

        setStatus(

            "Nexus başlatılıyor...",

            "AI motoru başlatılıyor. Lütfen bekleyin..."

        );


        debug(

            "AI motoru başlatılıyor..."

        );


        /* ------------------------------
           AŞAMA 7
           GERÇEK TEST
        ------------------------------ */

        debug(

            "AI motoru test ediliyor..."

        );


        const testResult =
            await generator(

                "Merhaba",

                {

                    max_new_tokens:
                        8

                }

            );


        debug(

            "AI test sonucu:",

            "success"

        );


        debug(

            JSON.stringify(
                testResult
            ),

            "success"

        );


        /* ------------------------------
           AŞAMA 8
        ------------------------------ */

        aiReady =
            true;


        setStatus(

            "Yerel AI • GPU",

            "Hazırım. Bana bir şey sor.",

            true

        );


        input.disabled =
            false;


        sendButton.disabled =
            false;


        debug(

            "================================",

            "success"

        );


        debug(

            "NEXUS-AI TAMAMEN HAZIR.",

            "success"

        );


        debug(

            "Kullanıcı mesajı bekleniyor.",

            "success"

        );


        debug(

            "================================",

            "success"

        );


        input.focus();


    }catch(error){


        aiReady =
            false;


        const errorMessage =
            stringifyError(
                error
            );


        debug(

            "================================",

            "error"

        );


        debug(

            "MODEL BAŞLATMA HATASI",

            "error"

        );


        debug(

            errorMessage,

            "error"

        );


        try{

            debug(

                "Hata objesi: " +
                JSON.stringify(
                    error
                ),

                "error"

            );

        }catch{}


        debug(

            "================================",

            "error"

        );


        setStatus(

            "Başlatılamadı",

            "Nexus-AI başlatılamadı. Konsolu kontrol et."

        );

    }

}


/* =========================================
   AI CEVABI
========================================= */

async function askNexus(
    text
){

    debug(
        "Kullanıcı mesajı: " +
        text
    );


    messages.push({

        role:
            "user",

        content:
            text

    });


    debug(
        "AI cevap üretmeye başladı..."
    );


    const output =
        await generator(

            messages,

            {

                max_new_tokens:
                    128,

                do_sample:
                    true,

                temperature:
                    0.7

            }

        );


    debug(
        "AI cevap üretimi tamamlandı.",
        "success"
    );


    const generated =
        output?.[0]?.generated_text;


    let answer =
        "";


    if(
        Array.isArray(
            generated
        )
    ){

        const last =
            generated[
                generated.length - 1
            ];


        answer =
            last?.content ||
            "";

    }


    if(!answer){

        answer =
            "Cevap üretilemedi.";

    }


    messages.push({

        role:
            "assistant",

        content:
            answer

    });


    return answer;

}


/* =========================================
   MESAJ GÖNDER
========================================= */

async function sendMessage(){

    const text =
        input.value.trim();


    if(
        !text ||
        !aiReady
    ){

        return;

    }


    addMessage(
        text,
        "user"
    );


    input.value =
        "";


    input.style.height =
        "auto";


    sendButton.disabled =
        true;


    try{


        const answer =
            await askNexus(
                text
            );


        addMessage(
            answer,
            "ai"
        );


    }catch(error){


        debug(

            "CEVAP HATASI: " +
            stringifyError(
                error
            ),

            "error"

        );


        addMessage(

            "Nexus cevap üretirken hata oluştu.",

            "ai"

        );

    }


    sendButton.disabled =
        false;


    input.focus();

}


/* =========================================
   GÖNDER BUTONU
========================================= */

sendButton.addEventListener(

    "click",

    sendMessage

);


/* =========================================
   ENTER
========================================= */

input.addEventListener(

    "keydown",

    event => {


        if(

            event.key ===
            "Enter"

            &&

            !event.shiftKey

        ){

            event.preventDefault();

            sendMessage();

        }

    }

);


/* =========================================
   TEXTAREA
========================================= */

input.addEventListener(

    "input",

    () => {


        input.style.height =
            "auto";


        input.style.height =
            Math.min(

                input.scrollHeight,

                120

            ) + "px";

    }

);


/* =========================================
   BAŞLAT
========================================= */

startNexus();


</script>


</body>

</html>
