<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Nexus-AI</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#080b12;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    height:100vh;
}

.app{
    height:100vh;
    display:flex;
    flex-direction:column;
}

.header{
    height:70px;
    display:flex;
    align-items:center;
    padding:0 16px;
    background:#0d1119;
    border-bottom:1px solid #202633;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.logoIcon{
    width:42px;
    height:42px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
    font-weight:900;
    background:linear-gradient(135deg,#695cff,#00c8ff);
}

.logoText{
    font-size:20px;
    font-weight:700;
}

.status{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:8px;
    color:#8993a5;
    font-size:13px;
}

.dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#f0a500;
}

.chat{
    flex:1;
    overflow-y:auto;
    padding:20px 14px 110px;
}

.welcome{
    text-align:center;
    margin-top:18vh;
}

.welcomeIcon{
    width:76px;
    height:76px;
    margin:auto;
    border-radius:24px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    font-weight:900;
    background:linear-gradient(135deg,#695cff,#00c8ff);
}

.welcome h1{
    margin-top:18px;
    font-size:29px;
}

.welcome p{
    margin:10px auto 0;
    max-width:320px;
    color:#858fa2;
    font-size:14px;
    line-height:1.5;
}

.message{
    display:flex;
    margin-bottom:16px;
}

.message.user{
    justify-content:flex-end;
}

.bubble{
    max-width:86%;
    padding:12px 15px;
    border-radius:17px;
    font-size:15px;
    line-height:1.5;
    white-space:pre-wrap;
}

.user .bubble{
    background:linear-gradient(135deg,#6256ee,#4840c4);
    border-bottom-right-radius:5px;
}

.ai .bubble{
    background:#151a24;
    border:1px solid #252c3a;
    border-bottom-left-radius:5px;
}

.inputArea{
    position:fixed;
    left:0;
    bottom:0;
    width:100%;
    padding:10px 14px 14px;
    background:linear-gradient(transparent,#080b12 30%);
}

.inputBox{
    display:flex;
    align-items:flex-end;
    gap:8px;
    padding:7px;
    background:#10151e;
    border:1px solid #29303e;
    border-radius:20px;
}

textarea{
    flex:1;
    min-height:42px;
    max-height:120px;
    resize:none;
    border:none;
    outline:none;
    background:transparent;
    color:white;
    padding:10px 7px;
    font-size:15px;
}

textarea::placeholder{
    color:#687386;
}

.send{
    width:44px;
    height:44px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,#695cff,#00b9ed);
    color:white;
    font-size:19px;
}

.send:disabled{
    opacity:.4;
}

</style>

</head>


<body>

<div class="app">

<header class="header">

    <div class="logo">

        <div class="logoIcon">
            N
        </div>

        <div class="logoText">
            Nexus-AI
        </div>

    </div>

    <div class="status">

        <div
            class="dot"
            id="dot">
        </div>

        <span id="status">
            Başlatılıyor...
        </span>

    </div>

</header>


<main
    class="chat"
    id="chat"
>

    <div
        class="welcome"
        id="welcome"
    >

        <div class="welcomeIcon">
            N
        </div>

        <h1>
            Nexus-AI
        </h1>

        <p id="welcomeText">
            Yerel yapay zekâ hazırlanıyor...
        </p>

    </div>

</main>


<div class="inputArea">

    <div class="inputBox">

        <textarea
            id="input"
            placeholder="Nexus'a bir şey sor..."
            disabled
        ></textarea>

        <button
            class="send"
            id="send"
            disabled
        >
            ➤
        </button>

    </div>

</div>

</div>


<script type="module">

import {
    pipeline
} from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.2.0";


const MODEL =
    "onnx-community/Qwen2.5-0.5B-Instruct";


const chat =
    document.getElementById("chat");

const input =
    document.getElementById("input");

const send =
    document.getElementById("send");

const welcome =
    document.getElementById("welcome");

const welcomeText =
    document.getElementById("welcomeText");

const status =
    document.getElementById("status");

const dot =
    document.getElementById("dot");


let generator = null;


const messages = [

    {
        role:"system",

        content:
        "Sen Nexus-AI'sın. Türkçe konuş. Yardımcı, doğal ve anlaşılır cevaplar ver."
    }

];


function setStatus(text,ready=false){

    status.textContent = text;

    if(ready){

        dot.style.background="#32d583";

        dot.style.boxShadow=
            "0 0 10px #32d583";

    }else{

        dot.style.background="#f0a500";

        dot.style.boxShadow=
            "0 0 10px #f0a500";

    }

}


function addMessage(text,type){

    welcome.style.display="none";

    const message =
        document.createElement("div");

    message.className=
        "message " + type;

    const bubble =
        document.createElement("div");

    bubble.className="bubble";

    bubble.textContent=text;

    message.appendChild(bubble);

    chat.appendChild(message);

    chat.scrollTop=
        chat.scrollHeight;

}


async function startNexus(){

    try{

        if(!navigator.gpu){

            throw new Error(
                "Bu tarayıcıda WebGPU bulunamadı."
            );

        }


        setStatus(
            "GPU hazırlanıyor..."
        );


        welcomeText.textContent=
            "Nexus'un yerel AI modeli hazırlanıyor. İlk açılışta büyük bir indirme yapılacak.";


        generator =
            await pipeline(

                "text-generation",

                MODEL,

                {

                    dtype:"q4",

                    device:"webgpu",

                    progress_callback:
                        (progress)=>{

                            if(
                                progress &&
                                progress.status ===
                                "progress"
                            ){

                                const percent =
                                    Math.round(
                                        progress.progress || 0
                                    );

                                setStatus(
                                    "Model %"+percent
                                );

                                welcomeText.textContent=
                                    "AI modeli indiriliyor: %"+
                                    percent;
                            }

                        }

                }

            );


        setStatus(
            "Yerel AI • GPU",
            true
        );


        welcomeText.textContent=
            "Hazırım. Bana bir şey sor.";

        input.disabled=false;

        send.disabled=false;

        input.focus();


    }catch(error){

        console.error(
            "NEXUS MODEL HATASI",
            error
        );


        setStatus(
            "Model yüklenemedi"
        );


        welcomeText.textContent=
            "Model başlatılamadı. Konsolu açıp gerçek hata kaydını kontrol et.";

    }

}


async function askNexus(text){

    messages.push({

        role:"user",

        content:text

    });


    const output =
        await generator(

            messages,

            {
                max_new_tokens:128,
                do_sample:true,
                temperature:0.7
            }

        );


    const generated =
        output[0].generated_text;


    let answer = "";


    if(Array.isArray(generated)){

        answer =
            generated[
                generated.length - 1
            ].content || "";

    }


    if(!answer){

        answer =
            "Cevap üretilemedi.";

    }


    messages.push({

        role:"assistant",

        content:answer

    });


    return answer;

}


async function sendMessage(){

    const text =
        input.value.trim();


    if(
        !text ||
        !generator
    ){

        return;

    }


    addMessage(
        text,
        "user"
    );


    input.value="";

    send.disabled=true;


    try{

        const answer =
            await askNexus(text);


        addMessage(
            answer,
            "ai"
        );


    }catch(error){

        console.error(
            "NEXUS CEVAP HATASI",
            error
        );


        addMessage(
            "Cevap oluşturulurken hata oluştu.",
            "ai"
        );

    }


    send.disabled=false;

    input.focus();

}


send.addEventListener(
    "click",
    sendMessage
);


input.addEventListener(
    "keydown",
    event=>{

        if(
            event.key==="Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


startNexus();

</script>

</body>

</html>
