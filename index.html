<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<meta
    name="theme-color"
    content="#080b12">

<title>Nexus-AI</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    background:#080b12;
    color:#ffffff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    overflow:hidden;
}

button,
textarea{
    font-family:inherit;
}

.app{
    width:100%;
    height:100dvh;

    display:flex;
    flex-direction:column;
}


/* =========================================
   HEADER
========================================= */

.header{
    height:68px;
    min-height:68px;

    display:flex;
    align-items:center;

    padding:0 15px;

    background:#0d1119;

    border-bottom:1px solid #202633;
}

.logo{
    display:flex;
    align-items:center;

    gap:10px;
}

.logoIcon{
    width:40px;
    height:40px;

    border-radius:13px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:20px;
    font-weight:900;

    background:
        linear-gradient(
            135deg,
            #695cff,
            #00c8ff
        );
}

.logoText{
    font-size:19px;
    font-weight:700;
}

.status{
    margin-left:auto;

    display:flex;
    align-items:center;

    gap:7px;

    color:#8e98aa;

    font-size:12px;
}

.statusDot{
    width:8px;
    height:8px;

    border-radius:50%;

    flex-shrink:0;

    background:#f0a500;

    box-shadow:
        0 0 9px #f0a500;
}


/* =========================================
   CHAT
========================================= */

.chat{
    flex:1;
    min-height:0;

    overflow-y:auto;

    padding:
        20px
        14px
        125px;

    -webkit-overflow-scrolling:touch;
}

.welcome{
    text-align:center;

    margin-top:17vh;
}

.welcomeIcon{
    width:72px;
    height:72px;

    margin:auto;

    border-radius:22px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:31px;
    font-weight:900;

    background:
        linear-gradient(
            135deg,
            #695cff,
            #00c8ff
        );

    box-shadow:
        0 0 35px
        rgba(90,100,255,.18);
}

.welcome h1{
    margin-top:18px;

    font-size:28px;
}

.welcome p{
    max-width:350px;

    margin:
        9px auto 0;

    color:#858fa2;

    font-size:14px;

    line-height:1.5;
}


/* =========================================
   MESAJLAR
========================================= */

.message{
    display:flex;

    width:100%;

    margin-bottom:15px;
}

.message.user{
    justify-content:flex-end;
}

.bubble{
    max-width:88%;

    padding:
        12px
        15px;

    border-radius:17px;

    font-size:15px;

    line-height:1.5;

    white-space:pre-wrap;

    overflow-wrap:anywhere;
}

.user .bubble{
    background:
        linear-gradient(
            135deg,
            #6256ee,
            #4840c4
        );

    border-bottom-right-radius:5px;
}

.ai .bubble{
    background:#151a24;

    border:1px solid #252c3a;

    border-bottom-left-radius:5px;
}


/* =========================================
   INPUT
========================================= */

.inputArea{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    z-index:100;

    padding:
        10px
        12px
        13px;

    background:
        linear-gradient(
            transparent,
            #080b12 28%
        );
}

.inputBox{
    display:flex;

    align-items:flex-end;

    gap:8px;

    max-width:800px;

    margin:auto;

    padding:7px;

    background:#10151e;

    border:1px solid #29303e;

    border-radius:20px;
}

textarea{
    flex:1;

    min-width:0;

    min-height:42px;
    max-height:120px;

    resize:none;

    border:none;
    outline:none;

    background:transparent;

    color:#ffffff;

    padding:
        10px
        7px;

    font-size:15px;

    line-height:21px;
}

textarea::placeholder{
    color:#687386;
}

.sendButton{
    width:43px;
    height:43px;

    flex-shrink:0;

    border:none;

    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            #695cff,
            #00b9ed
        );

    color:#ffffff;

    font-size:18px;
}

.sendButton:disabled{
    opacity:.4;
}


/* =========================================
   KONSOL BUTONU
========================================= */

.consoleToggle{
    position:fixed;

    right:13px;
    bottom:82px;

    z-index:500;

    border:1px solid #303847;

    border-radius:12px;

    padding:
        9px
        11px;

    background:#111720;

    color:#cbd3e1;

    font-size:11px;

    box-shadow:
        0 6px 20px
        rgba(0,0,0,.35);
}


/* =========================================
   KONSOL
========================================= */

.consolePanel{
    position:fixed;

    left:7px;
    right:7px;
    bottom:7px;

    height:62dvh;

    z-index:1000;

    display:none;

    flex-direction:column;

    overflow:hidden;

    background:#090d14;

    border:1px solid #303847;

    border-radius:18px;

    box-shadow:
        0 15px 60px
        rgba(0,0,0,.75);
}

.consolePanel.open{
    display:flex;
}

.consoleHeader{
    height:50px;
    min-height:50px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 11px;

    background:#111720;

    border-bottom:1px solid #252c38;
}

.consoleTitle{
    font-size:13px;
    font-weight:700;
}

.consoleActions{
    display:flex;

    gap:6px;
}

.consoleAction{
    border:none;

    border-radius:8px;

    padding:
        7px
        9px;

    background:#202735;

    color:#cbd3e1;

    font-size:10px;
}

.consoleBody{
    flex:1;

    min-height:0;

    overflow-y:auto;

    padding:9px;

    font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;

    font-size:10px;

    line-height:1.55;

    -webkit-overflow-scrolling:touch;
}

.consoleLine{
    padding:4px 0;

    border-bottom:
        1px solid
        rgba(255,255,255,.035);

    overflow-wrap:anywhere;
}

.consoleTime{
    color:#59657a;

    margin-right:6px;
}

.consoleInfo{
    color:#c4ccda;
}

.consoleSuccess{
    color:#55d995;
}

.consoleError{
    color:#ff7777;
}

.consoleWarn{
    color:#f0c674;
}

.consoleStage{
    color:#75a7ff;
    font-weight:600;
}


/* =========================================
   LOADING
========================================= */

.loading{
    display:flex;

    align-items:center;

    gap:5px;
}

.loading span{
    width:6px;
    height:6px;

    border-radius:50%;

    background:#8993a6;

    animation:
        loading 1.2s infinite;
}

.loading span:nth-child(2){
    animation-delay:.2s;
}

.loading span:nth-child(3){
    animation-delay:.4s;
}

@keyframes loading{

    0%,
    80%,
    100%{
        opacity:.25;
    }

    40%{
        opacity:1;
    }

}


/* =========================================
   MOBİL
========================================= */

@media(max-width:600px){

    .bubble{
        max-width:91%;
    }

    .consolePanel{
        height:64dvh;
    }

}

</style>

</head>


<body>


<div class="app">


<header class="header">

    <div class="logo">

        <div class="logoIcon">
            N
        </div>

        <div class="logoText">
            Nexus-AI
        </div>

    </div>


    <div class="status">

        <div
            class="statusDot"
            id="statusDot">
        </div>

        <span id="statusText">
            Başlatılıyor...
        </span>

    </div>

</header>


<main
    class="chat"
    id="chat">

    <div
        class="welcome"
        id="welcome">

        <div class="welcomeIcon">
            N
        </div>

        <h1>
            Nexus-AI
        </h1>

        <p id="welcomeText">
            Nexus-AI başlatılıyor...
        </p>

    </div>

</main>


<div class="inputArea">

    <div class="inputBox">

        <textarea
            id="messageInput"
            rows="1"
            disabled
            placeholder="Nexus'a bir şey sor...">
        </textarea>


        <button
            class="sendButton"
            id="sendButton"
            disabled>

            ➤

        </button>

    </div>

</div>


</div>


<button
    class="consoleToggle"
    id="consoleToggle">

    ⚙ Konsol

</button>


<section
    class="consolePanel"
    id="consolePanel">

    <div class="consoleHeader">

        <div class="consoleTitle">
            Nexus Console
        </div>


        <div class="consoleActions">

            <button
                class="consoleAction"
                id="clearConsole">

                Temizle

            </button>


            <button
                class="consoleAction"
                id="closeConsole">

                Kapat

            </button>

        </div>

    </div>


    <div
        class="consoleBody"
        id="consoleBody">
    </div>

</section>


<script type="module">


/* =========================================
   TRANSFORMERS.JS
========================================= */

import {
    pipeline,
    env
}
from
"https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.2.0";


/* =========================================
   CACHE
========================================= */

env.allowLocalModels =
    false;

env.useBrowserCache =
    true;

env.useWasmCache =
    true;


/* =========================================
   MODEL
========================================= */

const MODEL =
    "onnx-community/Qwen2.5-0.5B-Instruct";


/* =========================================
   STORAGE ANAHTARLARI
========================================= */

const LOG_STORAGE =
    "nexus_console_history_v3";

const STATE_STORAGE =
    "nexus_runtime_state_v3";

const SESSION_STORAGE =
    "nexus_session_v3";


/* =========================================
   ELEMENTLER
========================================= */

const chat =
    document.getElementById(
        "chat"
    );

const input =
    document.getElementById(
        "messageInput"
    );

const sendButton =
    document.getElementById(
        "sendButton"
    );

const welcome =
    document.getElementById(
        "welcome"
    );

const welcomeText =
    document.getElementById(
        "welcomeText"
    );

const statusText =
    document.getElementById(
        "statusText"
    );

const statusDot =
    document.getElementById(
        "statusDot"
    );

const consolePanel =
    document.getElementById(
        "consolePanel"
    );

const consoleBody =
    document.getElementById(
        "consoleBody"
    );

const consoleToggle =
    document.getElementById(
        "consoleToggle"
    );

const clearConsole =
    document.getElementById(
        "clearConsole"
    );

const closeConsole =
    document.getElementById(
        "closeConsole"
    );


/* =========================================
   DURUM DEĞİŞKENLERİ
========================================= */

let generator =
    null;

let aiReady =
    false;

let loadingModel =
    false;

let currentStage =
    "BAŞLANGIÇ";

let currentProgress =
    0;

let sessionId =
    crypto.randomUUID
        ? crypto.randomUUID()
        : Date.now().toString();

let heartbeatTimer =
    null;

let lastProgressPercent =
    -1;

let lastDoneFile =
    "";

let lastPersistedStage =
    "";


/* =========================================
   KONUŞMA
========================================= */

const messages = [

    {
        role:"system",

        content:
            "Sen Nexus-AI'sın. Türkçe konuş. Yardımcı, doğal, anlaşılır ve doğru cevaplar ver."
    }

];


/* =========================================
   HATA METNİ
========================================= */

function getErrorMessage(
    error
){

    if(!error){

        return "Bilinmeyen hata";

    }

    if(
        typeof error ===
        "string"
    ){

        return error;

    }

    if(error.message){

        return error.message;

    }

    try{

        const json =
            JSON.stringify(
                error
            );

        if(
            json &&
            json !== "{}"
        ){

            return json;

        }

    }catch{}

    return String(error);

}


/* =========================================
   HTML GÜVENLİĞİ
========================================= */

function escapeHTML(
    value
){

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =========================================
   KALICI KONSOL
========================================= */

function readStoredLogs(){

    try{

        const raw =
            localStorage.getItem(
                LOG_STORAGE
            );

        if(!raw){

            return [];

        }

        const data =
            JSON.parse(
                raw
            );

        return Array.isArray(data)
            ? data
            : [];

    }catch{

        return [];

    }

}


function saveStoredLog(
    message,
    type
){

    try{

        const logs =
            readStoredLogs();


        logs.push({

            time:
                new Date()
                .toLocaleTimeString(),

            message:
                String(message),

            type:
                type

        });


        /*
           Çok büyümesini engelle.
        */

        while(
            logs.length >
            250
        ){

            logs.shift();

        }


        localStorage.setItem(

            LOG_STORAGE,

            JSON.stringify(
                logs
            )

        );

    }catch{}

}


/* =========================================
   KONSOL EKRANA YAZ
========================================= */

function renderConsoleLine(
    item
){

    const line =
        document.createElement(
            "div"
        );


    let className =
        "consoleInfo";


    if(
        item.type ===
        "success"
    ){

        className =
            "consoleSuccess";

    }


    if(
        item.type ===
        "error"
    ){

        className =
            "consoleError";

    }


    if(
        item.type ===
        "warn"
    ){

        className =
            "consoleWarn";

    }


    if(
        item.type ===
        "stage"
    ){

        className =
            "consoleStage";

    }


    line.className =
        "consoleLine";


    line.innerHTML = `

        <span class="consoleTime">
            ${escapeHTML(item.time)}
        </span>

        <span class="${className}">
            ${escapeHTML(item.message)}
        </span>

    `;


    consoleBody.appendChild(
        line
    );

}


/* =========================================
   KONSOL LOG
========================================= */

function log(
    message,
    type="info",
    persist=true
){

    const time =
        new Date()
        .toLocaleTimeString();


    const item = {

        time:
            time,

        message:
            String(message),

        type:
            type

    };


    renderConsoleLine(
        item
    );


    consoleBody.scrollTop =
        consoleBody.scrollHeight;


    if(persist){

        saveStoredLog(
            message,
            type
        );

    }


    console.log(
        "[NEXUS]",
        message
    );

}


/* =========================================
   ESKİ KONSOLU YÜKLE
========================================= */

function restoreConsole(){

    const logs =
        readStoredLogs();


    if(!logs.length){

        return;

    }


    const separator =
        document.createElement(
            "div"
        );


    separator.className =
        "consoleLine";


    separator.innerHTML = `

        <span class="consoleStage">
            ───── ÖNCEKİ KONSOL KAYITLARI ─────
        </span>

    `;


    consoleBody.appendChild(
        separator
    );


    for(
        const item of logs
    ){

        renderConsoleLine(
            item
        );

    }


    const separator2 =
        document.createElement(
            "div"
        );


    separator2.className =
        "consoleLine";


    separator2.innerHTML = `

        <span class="consoleStage">
            ───── YENİ OTURUM ─────
        </span>

    `;


    consoleBody.appendChild(
        separator2
    );


    consoleBody.scrollTop =
        consoleBody.scrollHeight;

}


/* =========================================
   RUNTIME STATE
========================================= */

function saveRuntimeState(){

    try{

        localStorage.setItem(

            STATE_STORAGE,

            JSON.stringify({

                sessionId:
                    sessionId,

                timestamp:
                    Date.now(),

                stage:
                    currentStage,

                progress:
                    currentProgress,

                aiReady:
                    aiReady,

                loading:
                    loadingModel

            })

        );

    }catch{}

}


function getPreviousState(){

    try{

        const raw =
            localStorage.getItem(
                STATE_STORAGE
            );

        if(!raw){

            return null;

        }

        return JSON.parse(
            raw
        );

    }catch{

        return null;

    }

}


/* =========================================
   HEARTBEAT
========================================= */

function startHeartbeat(){

    saveRuntimeState();


    if(
        heartbeatTimer
    ){

        clearInterval(
            heartbeatTimer
        );

    }


    heartbeatTimer =
        setInterval(

            () => {

                saveRuntimeState();

            },

            1000

        );

}


/* =========================================
   AŞAMA DEĞİŞTİR
========================================= */

function setStage(
    stage,
    title,
    description,
    type="stage"
){

    currentStage =
        stage;


    saveRuntimeState();


    setStatus(
        title,
        description,
        false
    );


    /*
       Aynı aşamayı tekrar tekrar
       yazma.
    */

    if(
        stage ===
        lastPersistedStage
    ){

        return;

    }


    lastPersistedStage =
        stage;


    log(
        "AŞAMA → " +
        stage +
        " | " +
        description,
        type
    );

}


/* =========================================
   DURUM GÖRSELİ
========================================= */

function setStatus(
    title,
    description,
    ready=false
){

    statusText.textContent =
        title;


    welcomeText.textContent =
        description;


    if(ready){

        statusDot.style.background =
            "#32d583";

        statusDot.style.boxShadow =
            "0 0 10px #32d583";

    }else{

        statusDot.style.background =
            "#f0a500";

        statusDot.style.boxShadow =
            "0 0 10px #f0a500";

    }

}


/* =========================================
   ÖNCEKİ OTURUMU KONTROL ET
========================================= */

function checkPreviousSession(){

    const previous =
        getPreviousState();


    if(!previous){

        log(
            "Önceki Nexus oturumu bulunamadı."
        );

        return;

    }


    const age =
        Date.now() -
        Number(
            previous.timestamp || 0
        );


    /*
       10 dakikadan eski state'i
       aktif kesinti kabul etmiyoruz.
    */

    if(
        age >
        10 * 60 * 1000
    ){

        log(
            "Eski Nexus oturum kaydı bulundu ancak çok eski.",
            "info"
        );

        return;

    }


    if(
        previous.sessionId ===
        sessionId
    ){

        return;

    }


    log(
        "ÖNCEKİ OTURUM BULUNDU.",
        "warn"
    );


    log(
        "Önceki aşama: " +
        (
            previous.stage ||
            "Bilinmiyor"
        ),
        "warn"
    );


    log(
        "Önceki ilerleme: %" +
        (
            previous.progress ||
            0
        ),
        "warn"
    );


    if(
        previous.loading
    ){

        log(

            "Önceki oturum model yükleme sırasında kesilmiş olabilir.",

            "warn"

        );

    }


    log(

        "Yeni Nexus oturumu başlatılıyor.",

        "stage"

    );

}


/* =========================================
   GLOBAL HATALAR
========================================= */

window.addEventListener(
    "error",
    event => {

        log(

            "GLOBAL JAVASCRIPT HATASI: " +
            event.message,

            "error"

        );

    }
);


window.addEventListener(
    "unhandledrejection",
    event => {

        log(

            "GLOBAL PROMISE HATASI: " +
            getErrorMessage(
                event.reason
            ),

            "error"

        );

    }
);


/* =========================================
   SAYFA GÖRÜNÜRLÜĞÜ
========================================= */

document.addEventListener(
    "visibilitychange",
    () => {

        if(
            document.visibilityState ===
            "hidden"
        ){

            saveRuntimeState();


            log(

                "SAYFA ARKA PLANA GEÇTİ.",

                "warn"

            );


            log(

                "Chrome/iOS Nexus JavaScript ve WebGPU işlemlerini askıya alabilir.",

                "warn"

            );


            log(

                "Mevcut aşama: " +
                currentStage,

                "warn"

            );


            log(

                "Mevcut ilerleme: %" +
                currentProgress,

                "warn"

            );


            return;

        }


        if(
            document.visibilityState ===
            "visible"
        ){

            log(

                "SAYFA TEKRAR ÖN PLANA GELDİ.",

                "success"

            );


            log(

                "Nexus mevcut durumu kontrol ediyor...",

                "stage"

            );


            saveRuntimeState();

        }

    }
);


/* =========================================
   PAGEHIDE
========================================= */

window.addEventListener(
    "pagehide",
    () => {

        saveRuntimeState();


        /*
           Bu kayıt sayfa gerçekten
           kapanırken/yönlenirken kalır.
        */

        saveStoredLog(

            "SAYFA PAGEHIDE OLAYI ALDI. Son aşama: " +
            currentStage,

            "warn"

        );

    }
);


/* =========================================
   PROGRESS
========================================= */

function updateProgress(
    progress
){

    if(!progress){

        return;

    }


    const raw =
        Number(
            progress.progress
        );


    if(
        !Number.isFinite(
            raw
        )
    ){

        return;

    }


    const percent =
        Math.max(
            0,
            Math.min(
                100,
                Math.floor(raw)
            )
        );


    currentProgress =
        percent;


    saveRuntimeState();


    /*
       Aynı yüzdeyi tekrar gösterme.
    */

    if(
        percent ===
        lastProgressPercent
    ){

        return;

    }


    /*
       Geri giden yüzdeyi gösterme.
    */

    if(
        percent <
        lastProgressPercent
    ){

        return;

    }


    lastProgressPercent =
        percent;


    if(
        percent >=
        100
    ){

        setStage(

            "MODEL_DOSYALARI_HAZIR",

            "Model dosyaları hazır",

            "Model %100 tamamlandı. Şimdi AI motoru hazırlanacak.",

            "success"

        );


        return;

    }


    setStatus(

        "Model %" +
        percent,

        "AI modeli indiriliyor: %" +
        percent

    );


    log(

        "MODEL İLERLEMESİ → %" +
        percent,

        "info"

    );

}


/* =========================================
   DOSYA TAMAMLANDI
========================================= */

function handleDone(
    progress
){

    const file =
        progress?.file ||
        progress?.name ||
        "";


    /*
       Aynı dosyanın done kaydını
       tekrar yazma.
    */

    if(
        file &&
        file ===
        lastDoneFile
    ){

        return;

    }


    lastDoneFile =
        file;


    if(file){

        log(

            "MODEL DOSYASI HAZIR → " +
            file,

            "success"

        );

    }else{

        log(

            "Bir model dosyası hazır.",

            "success"

        );

    }

}


/* =========================================
   MESAJ
========================================= */

function addMessage(
    text,
    type
){

    welcome.style.display =
        "none";


    const message =
        document.createElement(
            "div"
        );


    message.className =
        "message " +
        type;


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "bubble";


    bubble.textContent =
        text;


    message.appendChild(
        bubble
    );


    chat.appendChild(
        message
    );


    chat.scrollTop =
        chat.scrollHeight;

}


/* =========================================
   AI LOADING
========================================= */

function showLoading(){

    const message =
        document.createElement(
            "div"
        );


    message.id =
        "aiLoading";


    message.className =
        "message ai";


    message.innerHTML = `

        <div class="bubble">

            <div class="loading">

                <span></span>
                <span></span>
                <span></span>

            </div>

        </div>

    `;


    chat.appendChild(
        message
    );


    chat.scrollTop =
        chat.scrollHeight;

}


function removeLoading(){

    const loading =
        document.getElementById(
            "aiLoading"
        );


    if(loading){

        loading.remove();

    }

}

/* =========================================
   NEXUS BAŞLAT
========================================= */

async function startNexus(){

    if(
        loadingModel
    ){

        log(

            "Zaten bir model yükleme işlemi çalışıyor.",

            "warn"

        );

        return;

    }


    if(
        aiReady
    ){

        log(
            "Nexus zaten hazır."
        );

        return;

    }


    loadingModel =
        true;


    currentProgress =
        0;


    lastProgressPercent =
        -1;


    lastDoneFile =
        "";


    lastPersistedStage =
        "";


    saveRuntimeState();


    log(
        "================================",
        "stage"
    );


    log(
        "NEXUS-AI YENİ OTURUM BAŞLATIYOR",
        "success"
    );


    log(
        "Oturum ID: " +
        sessionId,
        "info"
    );


    log(
        "Model: " +
        MODEL,
        "info"
    );


    log(
        "================================",
        "stage"
    );


    try{


        /* ===============================
           AŞAMA 1
        =============================== */

        setStage(

            "WEBGPU_KONTROL",

            "WebGPU kontrol ediliyor",

            "Cihazın GPU hızlandırması kontrol ediliyor."

        );


        if(
            !navigator.gpu
        ){

            throw new Error(

                "Bu tarayıcıda WebGPU bulunamadı."

            );

        }


        log(
            "WebGPU API bulundu.",
            "success"
        );


        /* ===============================
           AŞAMA 2
        =============================== */

        setStage(

            "ORTAM_KONTROL",

            "Ortam kontrol ediliyor",

            "HTTPS ve tarayıcı cache sistemi kontrol ediliyor."

        );


        log(

            "Protokol: " +
            location.protocol,

            "info"

        );


        log(

            "Tarayıcı: " +
            navigator.userAgent,

            "info"

        );


        log(

            "Browser Cache: " +
            (
                env.useBrowserCache
                    ? "AKTİF"
                    : "PASİF"
            ),

            env.useBrowserCache
                ? "success"
                : "warn"

        );


        log(

            "WASM Cache: " +
            (
                env.useWasmCache
                    ? "AKTİF"
                    : "PASİF"
            ),

            env.useWasmCache
                ? "success"
                : "warn"

        );


        /* ===============================
           AŞAMA 3
        =============================== */

        setStage(

            "MODEL_YUKLEME",

            "Model hazırlanıyor",

            "Model dosyaları kontrol ediliyor ve gerekiyorsa indiriliyor."

        );


        log(

            "Transformers.js pipeline başlatılıyor.",

            "info"

        );


        const started =
            performance.now();


        /*
           Pipeline başlıyor.
        */

        generator =
            await pipeline(

                "text-generation",

                MODEL,

                {

                    dtype:
                        "q4",

                    device:
                        "webgpu",


                    progress_callback:
                        progress => {

                            if(
                                !progress
                            ){

                                return;

                            }


                            /*
                               TOPLAM İLERLEME
                            */

                            if(
                                progress.status ===
                                "progress_total"
                            ){

                                updateProgress(
                                    progress
                                );

                                return;

                            }


                            /*
                               DOSYA İLERLEMESİ
                            */

                            if(
                                progress.status ===
                                "progress"
                            ){

                                updateProgress(
                                    progress
                                );

                                return;

                            }


                            /*
                               DOSYA TAMAMLANDI
                            */

                            if(
                                progress.status ===
                                "done"
                            ){

                                handleDone(
                                    progress
                                );

                                return;

                            }


                            /*
                               MODEL READY
                            */

                            if(
                                progress.status ===
                                "ready"
                            ){

                                setStage(

                                    "MODEL_RUNTIME_HAZIR",

                                    "Model motoru hazır",

                                    "Transformers.js model bileşenleri hazır.",

                                    "success"

                                );

                            }

                        }

                }

            );


        /* ===============================
           AŞAMA 4
        =============================== */

        setStage(

            "PIPELINE_TAMAMLANDI",

            "Pipeline hazır",

            "Model pipeline tamamen oluşturuldu.",

            "success"

        );


        const elapsed =
            Math.round(

                (
                    performance.now() -
                    started

                ) / 1000

            );


        log(

            "Pipeline oluşturma süresi: " +
            elapsed +
            " saniye.",

            "success"

        );


        /* ===============================
           AŞAMA 5
        =============================== */

        setStage(

            "WEBGPU_AI_HAZIRLIK",

            "AI motoru hazırlanıyor",

            "WebGPU üzerinde ilk AI çalışma testi hazırlanıyor."

        );


        log(

            "İlk AI test isteği hazırlanıyor.",

            "info"

        );


        /* ===============================
           AŞAMA 6
        =============================== */

        setStage(

            "AI_TEST",

            "AI test ediliyor",

            "Nexus ilk yerel AI cevabını üretmeyi deniyor."

        );


        const test =
            await generator(

                "Merhaba",

                {

                    max_new_tokens:
                        8

                }

            );


        log(

            "İlk AI test isteği başarıyla tamamlandı.",

            "success"

        );


        log(

            "Test çıktısı alındı.",

            "success"

        );


        /* ===============================
           AŞAMA 7
        =============================== */

        setStage(

            "NEXUS_HAZIR",

            "Yerel AI • GPU",

            "Nexus-AI hazır. Bana bir şey sor.",

            "success"

        );


        aiReady =
            true;


        loadingModel =
            false;


        saveRuntimeState();


        input.disabled =
            false;


        sendButton.disabled =
            false;


        log(
            "================================",
            "success"
        );


        log(

            "NEXUS-AI TAMAMEN HAZIR.",

            "success"

        );


        log(

            "GPU: WebGPU",

            "success"

        );


        log(

            "Model: " +
            MODEL,

            "success"

        );


        log(
            "================================",
            "success"
        );


        input.focus();

    }


    catch(error){

        loadingModel =
            false;


        saveRuntimeState();


        const message =
            getErrorMessage(
                error
            );


        /*
           Burada otomatik sonsuz
           yeniden başlatma YOK.
        */

        setStage(

            "HATA",

            "Model yüklenemedi",

            "Nexus bir aşamada durdu. Konsoldaki son aşamaya bak.",

            "error"

        );


        log(
            "================================",
            "error"
        );


        log(
            "NEXUS MODEL HATASI",
            "error"
        );


        log(
            "Hata: " +
            message,
            "error"
        );


        log(
            "Hata aşaması: " +
            currentStage,
            "error"
        );


        log(
            "Son ilerleme: %" +
            currentProgress,
            "error"
        );


        try{

            log(

                "Hata objesi: " +
                JSON.stringify(
                    error
                ),

                "error"

            );

        }catch{}


        log(
            "================================",
            "error"
        );

    }

}


/* =========================================
   AI CEVABI
========================================= */

async function askNexus(
    text
){

    log(
        "Kullanıcı mesajı alındı."
    );


    messages.push({

        role:
            "user",

        content:
            text

    });


    setStatus(

        "Cevap hazırlanıyor...",

        "Nexus düşünüyor...",

        true

    );


    log(
        "AI cevap üretimi başladı."
    );


    const output =
        await generator(

            messages,

            {

                max_new_tokens:
                    128,

                temperature:
                    0.7,

                do_sample:
                    true

            }

        );


    const generated =
        output?.[0]?.generated_text;


    let answer =
        "";


    if(
        Array.isArray(
            generated
        )
    ){

        const last =
            generated[
                generated.length - 1
            ];


        answer =
            last?.content ||
            "";

    }


    if(!answer){

        answer =
            "Cevap üretilemedi.";

    }


    messages.push({

        role:
            "assistant",

        content:
            answer

    });


    setStatus(

        "Yerel AI • GPU",

        "Hazırım. Bana bir şey sor.",

        true

    );


    log(
        "AI cevap üretimi tamamlandı.",
        "success"
    );


    return answer;

}


/* =========================================
   MESAJ GÖNDER
========================================= */

async function sendMessage(){

    const text =
        input.value.trim();


    if(
        !text ||
        !aiReady ||
        !generator
    ){

        return;

    }


    addMessage(
        text,
        "user"
    );


    input.value =
        "";

    input.style.height =
        "auto";


    sendButton.disabled =
        true;


    showLoading();


    try{

        const answer =
            await askNexus(
                text
            );


        removeLoading();


        addMessage(
            answer,
            "ai"
        );

    }


    catch(error){

        removeLoading();


        log(

            "CEVAP HATASI: " +
            getErrorMessage(
                error
            ),

            "error"

        );


        addMessage(

            "Nexus cevap üretirken hata oluştu.",

            "ai"

        );

    }


    sendButton.disabled =
        false;


    input.focus();

}


/* =========================================
   BUTON
========================================= */

sendButton.addEventListener(
    "click",
    sendMessage
);

input.addEventListener(

        if(
            event.key ===
            "Enter"

            &&

            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);

restoreConsole();

checkPreviousSession();

startHeartbeat();


log(

    "success"
);


log(
    "Oturum ID: " +
    sessionId
);


startNexus();


</script>
